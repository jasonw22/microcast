# Places and routes registry: every forecast target, and the join key
# (point_id) for every table downstream. Adding a target is a config change.
#
# This file is the public example. Real coordinates come from the environment
# (.env, see .env.example). For private routes, copy this file to
# config/places.local.yaml (git-ignored) and point geometry at routes/private/.

places:
  - id: home
    kind: point
    lat: ${MICROCAST_HOME_LAT}
    lon: ${MICROCAST_HOME_LON}
    sensors: [station_home, purpleair_home]
    variables: [t2m, td2m, wind10, gust, precip, pm25, low_cloud]

routes:
  - id: school_walk
    kind: route
    geometry: routes/examples/divisadero.geojson # Haight to Geary, ~1.4 km
    sample_every_m: 200
    mode: walk
    schedule:
      - {days: [mon, tue, wed, thu, fri], window: "07:45-08:25"}
      - {days: [mon, tue, wed, thu, fri], window: "15:15-15:40"}
    audience: [kids, lamont]

  - id: gg_park_ride
    kind: route
    # Divisadero & Fell, Panhandle, JFK Drive to the Great Highway (~6.3 km).
    geometry: routes/examples/gg_park_jfk.geojson
    sample_every_m: 500
    out_and_back: true # ridden back along the same path; return leg reverses bearings
    mode: bike
    flexible_departure: {earliest: "09:00", latest: "16:00", duration_min: 75}
    audience: [lamont]

# Ground-truth stations. Each becomes a virtual point (point_id = station id) so
# NWP is extracted at the station itself and residuals are learnt there. Phase 1
# trains on these until the home station exists (docs/decisions.md D5).
stations:
  - {id: SFOC1, source: iem_hads, lat: 37.7705, lon: -122.4269, note: "SF Downtown (the Mint), ~1 km from home; hourly temp"}
  - {id: KSFO, source: iem_asos, lat: 37.6190, lon: -122.3749, note: "SFO ASOS; temp, dewpoint, wind, gust"}
  - {id: KOAK, source: iem_asos, lat: 37.7178, lon: -122.2330, note: "Oakland ASOS; temp, dewpoint, wind, gust"}
  - {id: FTPC1, source: ndbc, lat: 37.8060, lon: -122.4660, note: "Fort Point, Golden Gate; temp, wind, gust, upwind of the park"}
  # Synoptic (free tier: last 7 days only, so these accrue from 2026-10 on; D10).
  - {id: 604PG, source: synoptic, lat: 37.7710, lon: -122.5080, note: "PG&E Golden Gate Park, west end of JFK Drive; temp, wind, gust"}
  - {id: C5988, source: synoptic, lat: 37.7600, lon: -122.4320, note: "CWOP, Castro; temp, wind, gust, solar (since 2006)"}
  - {id: F6803, source: synoptic, lat: 37.7590, lon: -122.4370, note: "CWOP, Castro; temp, wind, gust, solar"}
  - {id: E9227, source: synoptic, lat: 37.7560, lon: -122.4360, note: "CWOP, Castro; temp, wind, gust, solar"}
  - {id: F2543, source: synoptic, lat: 37.7630, lon: -122.4460, note: "CWOP, Corona Heights slope (~150 m); temp, wind, gust, solar"}
  - {id: F4637, source: synoptic, lat: 37.7700, lon: -122.4230, note: "CWOP, Duboce Triangle; temp, wind, gust"}
  - {id: GGBC1, source: synoptic, lat: 37.8198, lon: -122.4790, note: "Golden Gate Bridge mid-span, deck height (82 m); wind, gust, direction (mirrored vane, fixed in silver); MADIS lags ~2 days, so live obs come from here"}

# Sensors: ours, then public PurpleAir sensors on the marine-layer transect.
# Identifiers that would locate the house live in .env.
sensors:
  - id: purpleair_home
    kind: purpleair
    sensor_index: ${MICROCAST_PURPLEAIR_SENSOR_INDEX}
    note: public map location is snapped to the nearest corner; poll the LAN /json when on the home network
  - id: station_home
    kind: weather_station
    status: planned # wifi station for the back yard; must report solar radiation (D2) and wind
  # Public PurpleAir sensors, Ocean Beach → Sunset → Twin Peaks → Castro (D10).
  # BME280 temperature reads hot inside the housing: use as changes, not levels.
  # History is hourly temperature only, 2025-04 -> 2026-10-05; no longer ingested (spec,
  # "PurpleAir transect: ingest removed"). Kept because build gold uses their positions.
  - {id: pa_92183, kind: purpleair_network, sensor_index: 92183, lat: 37.7484, lon: -122.5022, note: "Ocean Beach"}
  - {id: pa_38837, kind: purpleair_network, sensor_index: 38837, lat: 37.7622, lon: -122.4995, note: "Outer Sunset, 40th & Irving"}
  - {id: pa_262467, kind: purpleair_network, sensor_index: 262467, lat: 37.7616, lon: -122.4881, note: "Outer Sunset, 29th & Judah"}
  - {id: pa_105692, kind: purpleair_network, sensor_index: 105692, lat: 37.7582, lon: -122.4755, note: "Central Sunset"}
  - {id: pa_68645, kind: purpleair_network, sensor_index: 68645, lat: 37.7601, lon: -122.4655, note: "Inner Sunset, Kirkham"}
  - {id: pa_113394, kind: purpleair_network, sensor_index: 113394, lat: 37.7516, lon: -122.4690, note: "Golden Gate Heights (elevation)"}
  - {id: pa_27231, kind: purpleair_network, sensor_index: 27231, lat: 37.7609, lon: -122.4522, note: "Cole Valley"}
  - {id: pa_295103, kind: purpleair_network, sensor_index: 295103, lat: 37.7535, lon: -122.4518, note: "Midtown Terrace, Twin Peaks west slope"}
  - {id: pa_284234, kind: purpleair_network, sensor_index: 284234, lat: 37.7556, lon: -122.4372, note: "Castro, Diamond & 21st (east of Twin Peaks)"}
  - {id: pa_117947, kind: purpleair_network, sensor_index: 117947, lat: 37.7639, lon: -122.4396, note: "Castro, States St (Corona Heights slope)"}
